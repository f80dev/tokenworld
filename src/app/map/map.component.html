<div id="map" [style.display]="user.game && user.game.url=='map' ? 'block' : 'none'"
     style="position: absolute;left:0;top:0;right:0;bottom:0;z-index: 0;">
</div>

<div class="image-container"
     *ngIf="message.length==0 && user.game && user.game.url!='map'">

  <mat-icon (click)="zoom_in()" class="button-map" style="top:0;">add_circle</mat-icon>
   <mat-icon (click)="zoom_out()" class="button-map"  style="top:20px;">remove_circle</mat-icon>

  <img class="image-map"
       [style.transform]="'translate(' + map_left + 'px, ' + map_top + 'px) scale(' + user.zoom + ')'"
       [src]="user.game.url">
</div>

<app-hourglass [message]="message"></app-hourglass>

<div style="position: fixed;left:0;top:0;height:40px;width: 100vw;text-align: center" *ngIf="message.length==0">
  <div class="toolbox" *ngIf="user">
    <!--    <mat-slide-toggle [(ngModel)]="user.show_visibility" (ngModelChange)="update_visibility()">Visibility</mat-slide-toggle>-->

    <button mat-raised-button *ngIf="!start_move"
            style="width: 90px;"
            title="Drop some NFT as tokemon on this game zone"
            (click)="open_drop()"><mat-icon>download</mat-icon>Drop</button>

    <mat-icon  (click)="move_tokemon()"
               *ngIf="(selected_tokemon && selected_tokemon.owner==user.idx) || start_move"
               title="Move"
               class="icon-button">
      run_circle
    </mat-icon>


    <mat-icon  (click)="fight()"
               *ngIf="to_attack && selected_tokemon && selected_tokemon.owner==user.idx"
               title="Fight the tokemon"
               class="icon-button">
      bolt
    </mat-icon>


    <div *ngIf="!start_move && !to_attack" style="display: inline-block;">
      <mat-icon  (click)="open_capture()"
                 *ngIf="selected_tokemon && (selected_tokemon.owner==user.idx || selected_tokemon.pv==0)"
                 title="Capture the tokemon"
                 class="icon-button">
        catching_pokemon
      </mat-icon>


      <mat-icon  (click)="fight()"
                 *ngIf="selected_tokemon && (selected_tokemon.owner!=user.idx && selected_tokemon.pv>0)"
                 title="Fight the tokemon"
                 class="icon-button">
        bolt
      </mat-icon>


      <mat-icon  (click)="recenter()"
                 title="Se déplacer"
                 class="icon-button">
        pin_drop
      </mat-icon>

      <mat-icon  (click)="show_my_tokemon()"
                 title="Se déplacer"
                 class="icon-button">
        person
      </mat-icon>


      <mat-icon  (click)="open_airdrop()"
                 title="Airdropr"
                 class="icon-button">
        paid
      </mat-icon>



      <mat-icon  (click)="user.preview=!user.preview;refresh();"
                 *ngIf="markers.length>0"
                 class="icon-button"
                 [style.opacity]="user.preview ? 1.0 : 0.4">image
      </mat-icon>

    </div>



<!--    <mat-slider style="display: inline-block;width:50%;max-width: 200px;" [step]="1" [min]="0" [max]="600">-->
<!--      <input matSliderThumb-->
<!--             [value]="user.visibility"-->
<!--             (valueChange)="user.visibility=$event">-->
<!--    </mat-slider>-->
  </div>
</div>


<img src="https://tokemon.f80.fr/assets/icons/target.png" class="target">
