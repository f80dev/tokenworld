<div class="mainform" style="text-align: center;">

  <h5>Select a game or create one</h5>
  <app-hourglass [message]="message">
  </app-hourglass>

  <div id="menu" style="margin:20px;" *ngIf="games.length>0">
    <mat-slide-toggle [(ngModel)]="show_closed_games" (ngModelChange)="refresh()">
      <div class="mat-slide-label">Closed<br>game</div>
    </mat-slide-toggle>

    <mat-slide-toggle [(ngModel)]="show_my_games" (ngModelChange)="update_only_mygame()">
      <div class="mat-slide-label">My game</div>
    </mat-slide-toggle>

    <mat-slide-toggle [(ngModel)]="show_nearest_zone" (ngModelChange)="refresh()">
      <div class="mat-slide-label">Nearest<br>game</div>
    </mat-slide-toggle>
  </div>

  <mat-accordion *ngIf="message.length==0">
    <mat-expansion-panel *ngFor="let game of games" [expanded]="games.length==1">
      <mat-expansion-panel-header>
        <mat-icon *ngIf="!game.closed" (click)="select(game)"
                  title="Play to this game"
                  style="color:cyan;font-size: x-large;margin-bottom: 0;margin-right: 10px;">play_circle</mat-icon>

        {{game.title}}
      </mat-expansion-panel-header>

      <app-game [game]="game" style="display: inline-block;width:100%;">
        <mat-expansion-panel style="width: 200px;"
                             *ngIf="user.isConnected(true) && game.owner==user.idx && !game.closed">
          <mat-expansion-panel-header>Command</mat-expansion-panel-header>
          <button mat-raised-button (click)="close_map(game)">Close</button><br>
          <button mat-raised-button (click)="stacking(game)">AirDrop</button>
        </mat-expansion-panel>
      </app-game>



    </mat-expansion-panel>
  </mat-accordion>



  <br><br>
  <button mat-raised-button (click)="create_game()">Create Game</button>

</div>
