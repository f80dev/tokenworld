<div class="mainform" style="text-align: center;padding: 5px;">
  <app-hourglass [message]="message"></app-hourglass><br>
  <button mat-raised-button
          *ngIf="message!='' && device.isMobile()"
          (click)="open_xportal()">
    Basculer sur xPortal
  </button>

  <div *ngIf="sel_nft && message.length==0" class="zone_input" >
    <button mat-raised-button
            (click)="drop()"
            title="Drop here">Drop !</button>

    <button mat-raised-button
            (click)="sel_nft=null"
            title="Cancel">Cancel</button>
    <br>

    <app-input value_type="text"
               label="Tokemon's name" help="Min length of 3 characters"
               (valueChange)="name=$event" [value]="name"></app-input>

  </div>

  <br>

  <mat-slide-toggle *ngIf="sel_nft && message.length==0 && (!user.game!.geoloc_to_drop || user.game!.owner==user.idx)" (toggleChange)="diffusion=0;"
                    [(ngModel)]="random_location">Everywhere in the game zone</mat-slide-toggle>

  <br>
  <div class="map_style" [style.display]="random_location || !sel_nft || message.length>0 ? 'none' : 'inline-block'">
    <div id="map" style="position: absolute;left:0;top:0;right: 0;bottom:0;z-index: 0;"></div>
<!--    <div class="disk" [style.width]="user.visibility*ech+'px'"-->
<!--         [style.height]="user.visibility*ech+'px'"-->
<!--         [style.margin-top]="-user.visibility*ech/2+'px'"-->
<!--         [style.margin-left]="-user.visibility*ech/2+'px'" >-->
<!--    </div>-->
  </div>

  <div *ngIf="message==''">
    <app-wallet [address]="user.address"
                show="nft"
                *ngIf="!sel_nft" message="Select a NFT to create a tokemon"
                [network]="user.network"
                (listChanged)="update_nfts($event)"
                (selectChanged)="on_select($event)">
    </app-wallet>

    <div class="zone_input" *ngIf="sel_nft">
<!--      <app-input value_type="number" [min]="user.game!.min_visibility" [max]="user.game!.max_visibility"-->
<!--                 label="Visibility" unity="meters"-->
<!--                 (valueChange)="visibility=$event" [value]="visibility"></app-input>-->
<!--      <br>-->

      <app-input *ngIf="max_quantity>1" value_type="number" [min]="1" [max]="max_quantity"
                 label="Number to drop" unity="NFT" [help]="'limit to '+max_quantity"
                 (valueChange)="quantity=$event" [value]="quantity"></app-input>
      <br>

      <app-input *ngIf="quantity>1 && !random_location" value_type="number"
                 label="Distance around target" unity="meters"
                 (valueChange)="diffusion=$event" [value]="diffusion"></app-input>
      <br>

      <app-input value_type="number" [min]="0" [max]="max_pv_loading"
                 *ngIf="max_pv_loading>0" [help]="'Maximum'+max_pv_loading"
                 label="Vitality to inject" unity="PV"
                 (valueChange)="lifepoint=$event" [value]="lifepoint"></app-input>


    </div>

    <br><br><br>
    <app-upload-file extensions=".csv"
                     style="display: none"
                     title="Charger un ficher excel"
                     width="100%"
                     height="60px"
                     (uploaded)="upload_excel($event)">
      Drop en masse
    </app-upload-file>



  </div>


</div>
