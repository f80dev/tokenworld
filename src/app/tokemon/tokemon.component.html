<div *ngIf="item" class="vignette" [style.width]="width" [style.height]="height" >

  <div style="display: flex;justify-content: space-between;width: 100%;">
    <div>
      <mat-icon (click)="copy_ref()"
                [title]="item.identifier || item.nft">content_copy</mat-icon>
      {{nft?.name}}
    </div>
    <div style="flex-grow: 1;"></div>
    <div *ngIf="item.pv>0">{{item.pv}} {{label_pv}}</div>
  </div>


  <div *ngIf="nft" style="cursor: pointer;width:90%;display: inline-block;margin:5%;">
    <img [src]="nft.url" (click)="on_select()" style="object-fit: cover;width:100%;height: 100%;">
  </div>

  <table style="font-size: x-small;width:80%;display: inline-block;">
    <tr *ngFor="let bag of bags" style="width: 100%;">
      <td>{{bag.coin}}</td>
      <td>{{bag.amount/1e18 | number:"1.0-3"}}</td>
      <td><mat-icon (click)="open_coin(bag.coin)">visibility</mat-icon></td>
    </tr>
  </table>


  <div style="width: 100%;font-size: x-small;">{{item.metadata?.description}}</div>
  <br>

</div>
